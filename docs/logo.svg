<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034694" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="6"/>

  <!-- Main Pin (Center) -->
  <g transform="translate(160, 60)">
    <!-- Pin Body -->
    <path d="M96 0 C149.02 0 192 42.98 192 96 C192 145 136 210 96 250 C56 210 0 145 0 96 C0 42.98 42.98 0 96 0 Z" fill="url(#pinGrad)"/>
    
    <!-- White Medical Cross -->
    <rect x="74" y="42" width="44" height="108" rx="10" fill="#ffffff"/>
    <rect x="42" y="74" width="108" height="44" rx="10" fill="#ffffff"/>
    
    <!-- Pulse Line inside cross -->
    <path d="M48 96 L76 96 L86 64 L106 128 L118 84 L126 96 L144 96" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Hafizabad Clock Tower (Ghanta Ghar silhouette) on left -->
  <g transform="translate(116, 120)" fill="#034694">
    <!-- Tower Dome & Spire -->
    <path d="M42 36 C42 22 47 10 48 0 C49 10 54 22 54 36 Z" />
    <ellipse cx="48" cy="38" rx="14" ry="7" />
    <!-- Cupola & Arches -->
    <rect x="38" y="42" width="20" height="24" rx="3" />
    <path d="M44 48 Q48 43 52 48 V66 H44 Z" fill="#ffffff" />
    <!-- Balcony -->
    <rect x="32" y="66" width="32" height="7" rx="2" />
    <!-- Clock Tier -->
    <rect x="35" y="73" width="26" height="30" />
    <circle cx="48" cy="88" r="7" fill="#ffffff" />
    <path d="M48 83 V88 H52" stroke="#034694" stroke-width="2" stroke-linecap="round" />
    <!-- Tower Shaft -->
    <rect x="37" y="103" width="22" height="48" />
    <!-- Base / Building -->
    <path d="M26 151 L70 151 L70 180 L26 180 Z" />
    <path d="M16 160 L26 151 L26 180 L16 180 Z" />
    <path d="M70 151 L80 160 L80 180 L70 180 Z" />
  </g>

  <!-- Rice Fields & Green Hills on right -->
  <g transform="translate(290, 185)">
    <!-- Trees -->
    <circle cx="56" cy="18" r="14" fill="#15803d"/>
    <circle cx="80" cy="22" r="16" fill="#16a34a"/>
    <circle cx="102" cy="26" r="12" fill="#22c55e"/>
    <!-- Terraced Rice Field Arcs -->
    <path d="M0 48 Q55 24 116 38 Q118 44 110 46 Q55 33 0 54 Z" fill="#15803d"/>
    <path d="M0 60 Q60 38 126 50 Q128 56 118 58 Q60 47 0 66 Z" fill="#22c55e"/>
    <path d="M0 72 Q65 52 136 62 Q138 68 126 70 Q65 60 0 78 Z" fill="#4ade80"/>
  </g>

  <!-- Caring Blue Hand sweeping under the landmark -->
  <path d="M110 216 C124 238 160 274 210 292 C248 306 290 300 310 286 C322 278 358 248 368 238 C358 258 332 288 296 306 C250 326 184 322 144 286 C122 266 112 242 110 216 Z" fill="url(#handGrad)"/>

  <!-- Brand Typography -->
  <text x="256" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#034694" letter-spacing="-1">Hafizabad</text>
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#059669" letter-spacing="-0.5">Health Guide</text>
  
  <!-- Divider Line & Tagline -->
  <line x1="88" y1="444" x2="114" y2="444" stroke="#034694" stroke-width="4" stroke-linecap="round"/>
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" fill="#034694">Hafizabad Ki Sehat, Ek Jagah</text>
  <line x1="398" y1="444" x2="424" y2="444" stroke="#034694" stroke-width="4" stroke-linecap="round"/>
</svg>
